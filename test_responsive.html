<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Responsive Login</title>
    <link rel="stylesheet" href="public/css/admin.css">
    <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        /* Estilos temporales para la prueba si fuera necesario */
    </style>
</head>
<body class="admin-body">
    <header class="admin-header">
        <div class="admin-topbar">
            <div class="admin-brand">
                <span class="admin-sax">🎷</span>
                <span class="admin-text">Administración</span>
            </div>
            <div class="admin-links">
                <a href="#"><i class="fa-solid fa-house"></i></a>
            </div>
        </div>
    </header>
    <main class="admin-main">
        <form class="admin-form">
            <h1 class="admin-title" style="margin-top: 0;">Iniciar Sesión</h1>
            <label>Usuario</label>
            <input type="text" name="usuario" required>
            <label>Contraseña</label>
            <input type="password" name="password" required>
            <button type="submit" class="admin-btn">ENTRAR</button>
        </form>
    </main>
    <footer class="admin-footer">
        <p class="copyright-line">
            &copy; 2026 Todos los derechos reservados
            <a href="#">lauraordonez.dev</a>
        </p>
    </footer>
</body>
</html>
